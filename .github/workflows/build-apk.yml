name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    # 允许手动触发构建

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-
        
    - name: Build Debug APK
      run: ./gradlew :Launcher:assembleDebug
      
    - name: Build Release APK
      run: ./gradlew :Launcher:assembleRelease
      
    - name: Create keystore
      run: |
        mkdir -p keystore
        keytool -genkeypair \
          -keystore keystore/aimc-keystore.jks \
          -alias aimc-key \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass aimc123456 \
          -keypass aimc123456 \
          -dname "CN=AI Minecraft Launcher, OU=Development, O=AIMC, L=Shanghai, ST=Shanghai, C=CN"
      
    - name: Sign APK
      run: |
        jarsigner -verbose \
          -sigalg SHA256withRSA \
          -digestalg SHA-256 \
          -keystore keystore/aimc-keystore.jks \
          -storepass aimc123456 \
          -keypass aimc123456 \
          Launcher/build/outputs/apk/release/Launcher-release-unsigned.apk \
          aimc-key
      
    - name: Align APK
      run: |
        zipalign -v 4 Launcher/build/outputs/apk/release/Launcher-release-unsigned.apk AI-Minecraft-Launcher-v1.0.0.apk
      
    - name: Verify APK
      run: |
        aapt dump badging AI-Minecraft-Launcher-v1.0.0.apk
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: Launcher/build/outputs/apk/debug/Launcher-debug.apk
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: AI-Minecraft-Launcher-v1.0.0.apk