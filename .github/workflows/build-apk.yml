name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Accept SDK licenses and install platform/build-tools
      run: |
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0"
      
    - name: Create release keystore
      run: |
        mkdir -p keystore
        keytool -genkeypair \
          -keystore keystore/aimc-keystore.jks \
          -alias aimc-key \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass aimc123456 \
          -keypass aimc123456 \
          -dname "CN=AI Minecraft Launcher, OU=Development, O=AIMC, L=Shanghai, ST=Shanghai, C=CN"
    
    - name: Setup Gradle 8.5
      run: |
        curl -fsSL -o "$RUNNER_TEMP/gradle-8.5-bin.zip" "https://services.gradle.org/distributions/gradle-8.5-bin.zip"
        unzip -q "$RUNNER_TEMP/gradle-8.5-bin.zip" -d "$HOME"
        "$HOME/gradle-8.5/bin/gradle" --version
        echo "$HOME/gradle-8.5/bin" >> "$GITHUB_PATH"
    
    # 不使用 Gradle 缓存：缓存 key 基于 *.gradle 文件，不包含资源文件，
    # 导致修改 colors.xml/styles.xml 后旧中间产物被恢复，AAPT 用到旧的 merged resources
    
    - name: Clean and Build Debug APK
      run: |
        set -o pipefail
        gradle :Launcher:clean :Launcher:assembleDebug --stacktrace --no-daemon 2>&1 | tee build-debug.log
      
    - name: Build Release APK
      run: |
        set -o pipefail
        gradle :Launcher:assembleRelease --stacktrace --no-daemon 2>&1 | tee build-release.log
      
    - name: Prepare release APK
      run: |
        set -e
        OUT=Launcher/build/outputs/apk/release
        if [ -f "$OUT/Launcher-release.apk" ]; then
          SRC="$OUT/Launcher-release.apk"
        else
          SRC="$OUT/Launcher-release-unsigned.apk"
        fi
        cp "$SRC" AI-Minecraft-Launcher-v1.0.0.apk
        ls -lh AI-Minecraft-Launcher-v1.0.0.apk
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: Launcher/build/outputs/apk/debug/Launcher-debug.apk
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: AI-Minecraft-Launcher-v1.0.0.apk

    - name: Report failure log to issue
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let out = '';
          for (const f of ['build-debug.log', 'build-release.log']) {
            try { out += `\n===== ${f} =====\n` + fs.readFileSync(f, 'utf8'); } catch (e) {}
          }
          if (!out.trim()) out = '(no build log captured)';
          
          // 提取关键错误段
          const lines = out.split('\n');
          let errorSection = '';
          let inError = false;
          for (let i = 0; i < lines.length; i++) {
            if (lines[i].includes('What went wrong') || lines[i].includes('Execution failed for task')) {
              inError = true;
            }
            if (inError) {
              errorSection += lines[i] + '\n';
              if (lines[i].includes('* Exception is:') || lines[i].includes('BUILD FAILED')) {
                break;
              }
            }
          }
          if (!errorSection.trim()) {
            errorSection = lines.slice(-500).join('\n');
          }
          const errorLines = lines.filter(l => l.includes('error:') || l.includes('ERROR') || l.includes('not found'));
          const result = errorSection + '\n\n--- All error lines ---\n' + errorLines.join('\n');
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: 1,
            body: `**Build failed** (\`${context.sha.slice(0, 7)}\`)\n\n\`\`\`\n${result.slice(0, 60000)}\n\`\`\``
          });
