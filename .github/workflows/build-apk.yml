name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Accept SDK licenses and install platform/build-tools
      run: |
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0"
      
    # Release 构建的 signingConfig 指向 keystore/aimc-keystore.jks，
    # 必须在 assembleRelease 之前生成，否则会报 "Keystore file not found"
    - name: Create release keystore
      run: |
        mkdir -p keystore
        keytool -genkeypair \
          -keystore keystore/aimc-keystore.jks \
          -alias aimc-key \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass aimc123456 \
          -keypass aimc123456 \
          -dname "CN=AI Minecraft Launcher, OU=Development, O=AIMC, L=Shanghai, ST=Shanghai, C=CN"
    
    # 仓库里没有提交 gradle-wrapper.jar（曾被 .gitignore 误忽略），
    # 这里用官方 Gradle 发行版生成完整可用的 Wrapper，保证 ./gradlew 能正常执行
    - name: Setup Gradle and generate wrapper
      run: |
        curl -fsSL -o /tmp/gradle-8.5-bin.zip "https://services.gradle.org/distributions/gradle-8.5-bin.zip"
        unzip -q /tmp/gradle-8.5-bin.zip -d /opt
        /opt/gradle-8.5/bin/gradle wrapper --gradle-version 8.5 --distribution-type bin
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-
        
    - name: Build Debug APK
      run: ./gradlew :Launcher:assembleDebug
      
    - name: Build Release APK
      run: ./gradlew :Launcher:assembleRelease
      
    # signingConfig 生效时产出 Launcher-release.apk（已签名、已对齐），
    # 兼容未启用签名配置时产出的 unsigned 文件名
    - name: Prepare release APK
      run: |
        set -e
        OUT=Launcher/build/outputs/apk/release
        if [ -f "$OUT/Launcher-release.apk" ]; then
          SRC="$OUT/Launcher-release.apk"
        else
          SRC="$OUT/Launcher-release-unsigned.apk"
        fi
        cp "$SRC" AI-Minecraft-Launcher-v1.0.0.apk
        ls -lh AI-Minecraft-Launcher-v1.0.0.apk
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: Launcher/build/outputs/apk/debug/Launcher-debug.apk
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: AI-Minecraft-Launcher-v1.0.0.apk
